apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-strength-checker
  labels:
    app: password-strength-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: password-strength-checker
  template:
    metadata:
      labels:
        app: password-strength-checker
    spec:
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5004
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
